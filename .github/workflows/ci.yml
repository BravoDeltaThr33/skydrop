name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  tests:
    name: Tests (${{ matrix.os }}, Python ${{ matrix.python }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ["3.10", "3.13"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install test tools
        run: python -m pip install pillow pyte pytest tzdata
      - name: Run the tests
        run: python -m pytest -q tests
      - name: Start-up check
        run: |
          python -m skydrop --version
          python -m skydrop --help

  install:
    name: Installer (${{ matrix.os }})
    needs: tests
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Install and run (Linux, macOS)
        if: runner.os != 'Windows'
        run: |
          ./install.sh --yes --no-voice --no-apt
          ~/.local/bin/skydrop --version
          ~/.local/share/skydrop/uninstall.sh
      - name: Install and run (Windows)
        if: runner.os == 'Windows'
        shell: cmd
        run: |
          call install.cmd -Yes -NoVoice || exit /b 1
          call "%LOCALAPPDATA%\skydrop\bin\skydrop.cmd" --version || exit /b 1
          powershell -NoProfile -ExecutionPolicy Bypass -File "%LOCALAPPDATA%\skydrop\uninstall.ps1"

  packages:
    name: Release files
    needs: tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install pillow
      - name: Build
        run: python tools/build_release.py --out dist
      - name: Install the .deb
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y ./dist/skydrop_*_all.deb
          skydrop --version
          sudo apt-get remove -y skydrop
      - uses: actions/upload-artifact@v4
        with:
          name: skydrop-release-files
          path: dist/
